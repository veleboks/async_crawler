[project]
name = "async-crawler"
version = "0.1.0"
description = "Учебный асинхронный веб-краулер"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiofiles",
    "aiohttp",
    "aiosqlite",
    "beautifulsoup4",
    "lxml",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff>=0.16.0",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "crawler"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "auto"
